# Add inside each site's `server { ... }` block. Use port 8080 for production, 8081 for staging
# (whatever PORT is in /etc/milkky/<env>.env).
location /ws {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s; # the server pings every 30 s
}

# Room invite links: /join?room=CODE serves join.html (its "Join me" link preview, then on to the game).
location = /join {
    try_files /join.html =404;
}
