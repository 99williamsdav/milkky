<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch this shot on Milkky</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<!-- Shared shots (/replay?id=ID) point here so their link preview is about the replay.
     Preview crawlers don't run scripts, so they read the tags below; people are sent straight on to the game. -->
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Milkky">
<meta property="og:title" content="Watch this shot on Milkky">
<meta property="og:description" content="A slow-motion replay of a shot from Milkky. Tap to watch it, then have a go yourself.">
<meta property="og:image" content="https://milkky.flutterbot.co.uk/og-replay.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Watch this shot on Milkky: twelve numbered milk bottles on a lawn">
<meta name="twitter:card" content="summary_large_image">
<script>const q = new URLSearchParams(location.search); q.set('replay', q.get('id') || ''); q.delete('id'); location.replace('./?' + q + location.hash);</script>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#5f9a3e;color:#fbf6ea;font:18px system-ui,sans-serif}
a{color:inherit}
</style>
</head>
<body>
<p>Opening the game… <a id="go" href="./">Tap here if it doesn't open</a></p>
<script>document.getElementById('go').href = './?' + q;</script>
</body>
</html>
